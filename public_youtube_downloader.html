<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>YouTubeダウンローダー</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    input[type="text"] { width: 350px; }
    button { font-size: 1.1em; }
    .msg { margin-top: 1em; color: #444; }
  </style>
</head>
<body>
  <h1>YouTubeダウンローダー</h1>
  <input type="text" id="yturl" placeholder="YouTubeの動画URLを貼り付け">
  <button onclick="download()">ダウンロード</button>
  <div class="msg" id="msg"></div>
  <script>
    function download() {
      const url = document.getElementById('yturl').value.trim();
      if (!url) {
        document.getElementById('msg').textContent = "URLを入力してください。";
        return;
      }
      document.getElementById('msg').textContent = "ダウンロードを開始します...";
      window.location = `http://localhost:3001/api/download?url=${encodeURIComponent(url)}`;
      setTimeout(() => { document.getElementById('msg').textContent = ""; }, 3000);
    }
  </script>
</body>
</html>
